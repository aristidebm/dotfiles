# plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# activate tmux extended keys (needed by pi-coding agent)
set -g extended-keys on
set -g extended-keys-format csi-u

# forward window-focus signals sent by terminal emulator (wezterm)
# to the underling application (neovim for example)
set -g focus-events on

# # use vi keybinding in copy mode
set -g mode-keys vi

# # status bar structure customization
set -g base-index 1
bind e run -b "
    sesh connect $(sesh list | fzf-tmux -d 50% \
		--no-sort --ansi --layout=reverse --prompt '> ' \
		--header ' ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
		--bind 'tab:down,btab:up' \
		--bind 'ctrl-a:change-prompt(> )+reload(sesh list)' \
		--bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t)' \
		--bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c)' \
		--bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z)' \
		--bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
		--bind 'ctrl-d:execute(tmux kill-session -t {})+change-prompt(> )+reload(sesh list)') || true"

# ccmux fleet management for AI agents
# pop open the ccmux picker from anywhere
bind-key a display-popup -E -w 95% -h 80% "ccmux"

# Initialize TPM (keep this line at the very bottom of tmux.conf)
run -b '~/.config/tmux/plugins/tpm/tpm'
