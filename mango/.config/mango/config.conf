# https://github.com/mangowm/mango/wiki/
# https://github.com/mangowm/mango/wiki/xdg-portals
borderpx = 2
border_radius = 10-o
scratchpad_width_ratio = 0.9
scratchpad_height_ratio = 0.7
xkb_rules_options=compose:caps
animations=1
tag_carousel=1
cursor_hide_on_keypress=1
animation_duration_open=100
animation_duration_close=100
animation_duration_move=100
tag_animation_direction=0
repeat_rate=40
repeat_delay=300
# https://github.com/mangowm/mango/blob/7cfeeb3687ab95028b2c41bd010044a9051eb968/docs/configuration/miscellaneous.md
view_current_to_back=0

# https://github.com/DreamMaoMao/mangowc/wiki#trackpad-settings--mouse-settings
mouse_natural_scrolling=0
trackpad_natural_scrolling=0

# Do not focus on active, it can disrupt my focus
# https://github.com/mangowm/mango/wiki#miscellaneous-settings
focus_on_activate=0

# disable overview
enable_hotarea=0

scroller_proportion_preset=0.5,0.8,1.0

# Keybdings (https://mangowc.vercel.app/docs/bindings/keys)

# Do not try to use st here, st is not working on wayland
bind=Super+Shift,Return,spawn,wezterm
# bind=Super,d,spawn,rofi -show drun
bind=Super,Tab,switch_layout
bind=Super+Shift,r,reload_config
bind=Super,r,switch_proportion_preset

bind=NONE,XF86MonBrightnessUp,spawn,brightnessctl set +10%
bind=NONE,XF86MonBrightnessDown,spawn,brightnessctl set 10%-
bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_SINK@ 5%+
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_SINK@ 5%-
bind=SUPER,d,spawn,qs ipc call AppLauncher toggle
bind=SUPER,c,spawn,qs ipc call NotificationServer toggleCenter
bind=SUPER,m,spawn,qs ipc call MusicPlayer toggle

# bind=SUPER,d,spawn,noctalia msg panel-toggle launcher
# bind=SUPER,s,spawn,noctalia msg panel-toggle control-center
# bind=SUPER,comma,spawn,noctalia msg settings-toggle
# bind=NONE,XF86AudioRaiseVolume,spawn,noctalia msg volume-up
# bind=NONE,XF86AudioLowerVolume,spawn,noctalia msg volume-down
# bind=NONE,XF86AudioMute,spawn,noctalia msg volume-mute
# bind=NONE,XF86MonBrightnessUp,spawn,noctalia msg brightness-up
# bind=NONE,XF86MonBrightnessDown,spawn,noctalia msg brightness-down

## Window managment

bind=Super,q,killclient
bind=Super,space,togglemaximizescreen
bind=Super+Shift,f,togglefullscreen
bind=Super+Shift,space,togglefloating
bind=Super,o,toggle_scratchpad
bind=Super,i,minimized
bind=Super,n,focusstack,next
bind=Super,p,focusstack,prev
bind=Super+Shift,n,exchange_stack_client,next
bind=Super+Shift,p,exchange_stack_client,prev
bind=Super+Shift,period,resizewin, +50, +0
bind=Super+Shift,comma,resizewin, -50, -0
# axisbind=SUPER+Shift,UP,focusdir,right
# axisbind=SUPER+Shift,DOWN,focusdir,left
# https://github.com/DreamMaoMao/mangowc/discussions/65
# the appId is obtained through the mmsg -w -c IPC
windowrule=tags:1,appid:dev.zed.Zed
windowrule=tags:2,appid:org.qutebrowser.qutebrowser
windowrule=tags:2,appid:appid:brave-browser
windowrule=tags:3,appid:ONLYOFFICE
windowrule=tags:4,org.telegram.desktop
windowrule=isfloating:1,width:1600,height:750,title:AppLauncher
windowrule=isfloating:1,width:1600,height:750,title:NotificationCenter
windowrule=isfloating:1,width:700,height:300,title:MusicPlayer
# pastel pick window is called zenity, we want it to be floating
windowrule=isfloating:1,appid:zenity
## Position windows relative to screen center
# windowrule=offsetx:20,offsety:-30,width:1600,height:750,isfloating:1,appid:thunar

## Tag managment

bind=Super,1,view,1
bind=Super,2,view,2
bind=Super,3,view,3
bind=Super,4,view,4
bind=Super,5,view,5
bind=Super,6,view,-1 # mimic vim alternate
bind=Super,7,view,7
bind=Super,8,view,8
bind=Super,9,view,9
bind=Super,0,view,0
bind=Super+Shift,1,tagsilent,1
bind=Super+Shift,2,tagsilent,2
bind=Super+Shift,3,tagsilent,3
bind=Super+Shift,4,tagsilent,4
bind=Super+Shift,5,tagsilent,5
bind=Super+Shift,6,tagsilent,6
bind=Super+Shift,7,tagsilent,7
bind=Super+Shift,8,tagsilent,8
bind=Super+Shift,9,tagsilent,9

# https://github.com/mangowm/mango/wiki/rules#examples
tagrule=id:1,layout_name:vertical_scroller
tagrule=id:2,layout_name:scroller

## Layouts

# https://github.com/mangowm/mango/wiki/layouts#supported-layouts
# Avoid switching to next/prev windows when pointer reach current window edge.
edge_scroller_pointer_focus=0
circle_layout=scroller,vertical_scroller,monocle,deck,vertical_deck,tile,grid,center_tile,vertical_tile,right_tile,vertical_grid,dwindle,fair,vertical_fair

## colors
maximizescreencolor=0x778899
focuscolor=0x778899
scratchpadcolor=0x778899

## Spawns
exec-once=~/.config/mango/autostart.sh;quickshell -c ~/.config/quickshell/;
