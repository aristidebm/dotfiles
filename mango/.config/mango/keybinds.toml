[bind.default]
"SUPER+SHIFT+Return" = "spawn,alacritty"
"SUPER+Tab" = "switch_layout"
"SUPER+SHIFT+r" = "reload_config"
"SUPER+r" = "switch_proportion_preset"

"XF86MonBrightnessUp" = "spawn,brightnessctl set +10%"
"XF86MonBrightnessDown" = "spawn,brightnessctl set 10%-"
"XF86AudioRaiseVolume" = "spawn,wpctl set-volume @DEFAULT_SINK@ 5%+"
"XF86AudioLowerVolume" = "spawn,wpctl set-volume @DEFAULT_SINK@ 5%-"
"SUPER+d" = "spawn,qs ipc call AppLauncher toggle"
"SUPER+c" = "spawn,qs ipc call NotificationServer toggleCenter"
"SUPER+m" = "spawn,qs ipc call mpris toggle"
"SUPER+v" = "spawn,voxtype record toggle"

"SUPER+q" = "killclient"
"SUPER+space" = "togglemaximizescreen"
"SUPER+SHIFT+f" = "togglefullscreen"
"SUPER+SHIFT+space" = "togglefloating"
"SUPER+o" = "toggle_scratchpad"
"SUPER+i" = "minimized"
"SUPER+n" = "focusstack,next"
"SUPER+p" = "focusstack,prev"
"SUPER+SHIFT+n" = "exchange_stack_client,next"
"SUPER+SHIFT+p" = "exchange_stack_client,prev"
"SUPER+SHIFT+period" = "resizewin,+50,+0"
"SUPER+SHIFT+comma" = "resizewin,-50,-0"

"SUPER+1" = "view,1"
"SUPER+2" = "view,2"
"SUPER+3" = "view,3"
"SUPER+4" = "view,4"
"SUPER+5" = "view,5"
"SUPER+6" = "view,-1"
"SUPER+7" = "view,7"
"SUPER+8" = "view,8"
"SUPER+9" = "view,9"
"SUPER+0" = "overcircle,next"

"SUPER+SHIFT+1" = "tagsilent,1"
"SUPER+SHIFT+2" = "tagsilent,2"
"SUPER+SHIFT+3" = "tagsilent,3"
"SUPER+SHIFT+4" = "tagsilent,4"
"SUPER+SHIFT+5" = "tagsilent,5"
"SUPER+SHIFT+6" = "tagsilent,6"
"SUPER+SHIFT+7" = "tagsilent,7"
"SUPER+SHIFT+8" = "tagsilent,8"
"SUPER+SHIFT+9" = "tagsilent,9"

[mousebind.default]
"SUPER+btn_left" = "moveresize,curmove"
"SUPER+btn_right" = "moveresize,curresize"
"btn_middle" = "togglemaximizescreen,0"
